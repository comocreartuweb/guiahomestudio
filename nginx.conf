server_tokens off;

server {
    listen 80;
    server_name www.guiahomestudio.com;
    return 301 https://guiahomestudio.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
    # HSTS (SEG-04 de la auditoría 001): un día para empezar; subir a un año (31536000) tras comprobarlo.
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /index.html {
        internal;
        root /usr/share/nginx/html;
        add_header Retry-After 3600 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    error_page 503 /index.html;

    location / {
        return 503;
    }
}
